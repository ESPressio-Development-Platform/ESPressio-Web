[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    https://github.com/ESPressio-Development-Platform/ESPressio-System.git#main
    https://github.com/ESPressio-Development-Platform/ESPressio-Observable.git#main
    https://github.com/ESPressio-Development-Platform/ESPressio-WiFi.git#main
    https://github.com/ESPressio-Development-Platform/ESPressio-Persistence.git#main
lib_extra_dirs =
    ../..
    ../../ESPressio-ESP32
