name: Primitive Discovery Contract

on:
  push:
    branches: [ primitives_redesign ]
    paths:
      - 'src/ESPressio_WebPrimitiveDiscovery.hpp'
      - 'tests/test_primitive_discovery.cpp'
      - '.github/workflows/primitives-redesign-discovery.yml'
  pull_request:
    paths:
      - 'src/ESPressio_WebPrimitiveDiscovery.hpp'
      - 'tests/test_primitive_discovery.cpp'
      - '.github/workflows/primitives-redesign-discovery.yml'

jobs:
  primitive-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-Web
      - name: Check out ESPressio Primitive primitives redesign branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: primitives_redesign
          path: ESPressio-Primitive
      - name: Compile D10-01 discovery contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror
          -I ESPressio-Web/src
          -I ESPressio-Primitive/src
          ESPressio-Web/tests/test_primitive_discovery.cpp
          -o primitive-discovery-test
      - name: Run D10-01 discovery contract
        run: ./primitive-discovery-test
