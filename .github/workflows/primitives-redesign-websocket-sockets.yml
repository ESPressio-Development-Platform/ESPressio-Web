name: WebSocket Neutral Sockets Contract

on:
  push:
    branches: [ primitives_redesign ]
    paths:
      - 'src/ESPressio_WebSocketSocketAdapter.hpp'
      - 'src/ESPressio_WebSocketEventBridge.hpp'
      - 'src/ESPressio_WebSocketEvents.hpp'
      - 'tests/test_websocket_socket_adapter.cpp'
      - 'tests/test_websocket_event_bridge.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/primitives-redesign-websocket-sockets.yml'
  pull_request:
    paths:
      - 'src/ESPressio_WebSocketSocketAdapter.hpp'
      - 'src/ESPressio_WebSocketEventBridge.hpp'
      - 'src/ESPressio_WebSocketEvents.hpp'
      - 'tests/test_websocket_socket_adapter.cpp'
      - 'tests/test_websocket_event_bridge.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/primitives-redesign-websocket-sockets.yml'

jobs:
  websocket-sockets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-Web
      - name: Check out System redesign
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: primitives_redesign
          path: ESPressio-System
      - name: Check out Observable redesign
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: primitives_redesign
          path: ESPressio-Observable
      - name: Check out Primitive redesign
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: primitives_redesign
          path: ESPressio-Primitive
      - name: Check out Task redesign
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: primitives_redesign
          path: ESPressio-Task
      - name: Check out Adapters redesign
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Adapters
          ref: primitives_redesign
          path: ESPressio-Adapters
      - name: Check out Sockets redesign
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Sockets
          ref: primitives_redesign
          path: ESPressio-Sockets
      - name: Reject family-owned predecessor WebSocket transport paths
        run: |
          if grep -nE 'ESPressio_Event|TypedEvent|EventTransportManager|IEventTransport|CommandRegistry|StateTransport' ESPressio-Web/src/ESPressio_WebSocketSocketAdapter.hpp; then
            exit 1
          fi
      - name: Compile D10-06 neutral WebSocket transport contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror
          -I ESPressio-Web/src
          -I ESPressio-Sockets/src
          -I ESPressio-Adapters/src
          -I ESPressio-Primitive/src
          -I ESPressio-Task/src
          -I ESPressio-System/src
          -I ESPressio-Observable/src
          ESPressio-Web/tests/test_websocket_socket_adapter.cpp
          -pthread
          -o websocket-sockets-test
      - name: Run D10-06 neutral WebSocket transport contract
        run: ./websocket-sockets-test
