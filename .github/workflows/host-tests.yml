name: Host Tests

on:
  push:
    branches: [ main, 'feature/**', 'bugfix/**', 'optimisation/**', 'work/**' ]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build/tests
      - name: Build
        run: cmake --build build/tests --parallel
      - name: Run
        run: ./build/tests/espressio_web_core_include
